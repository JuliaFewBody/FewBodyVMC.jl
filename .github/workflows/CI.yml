name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
# shortcut: pin the proposed shared API for PR CI, remove after 0.1 is registered.
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 'min'
            os: ubuntu-latest
            experimental: false
            coverage: false
          - version: '1'
            os: ubuntu-latest
            experimental: false
            coverage: true
          - version: 'pre'
            os: ubuntu-latest
            experimental: true
            coverage: false
          - version: '1'
            os: macOS-latest
            experimental: false
            coverage: false
          - version: '1'
            os: windows-latest
            experimental: false
            coverage: false
    steps:
      - uses: actions/checkout@v6
      - name: Check out proposed Hamiltonians
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: JuliaFewBody/FewBodyHamiltonians.jl
          ref: e67bc19ca413849c244384fe0ce028da00fb323c
          path: .ci/FewBodyHamiltonians
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Use proposed Hamiltonians
        if: github.event_name == 'pull_request'
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(path=joinpath(pwd(), ".ci", "FewBodyHamiltonians"))
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v5
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - name: Check out proposed Hamiltonians
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          repository: JuliaFewBody/FewBodyHamiltonians.jl
          ref: e67bc19ca413849c244384fe0ce028da00fb323c
          path: .ci/FewBodyHamiltonians
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Use proposed Hamiltonians
        if: github.event_name == 'pull_request'
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(path=joinpath(pwd(), ".ci", "FewBodyHamiltonians"))
      - name: Use proposed Hamiltonians in docs
        if: github.event_name == 'pull_request'
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop([
            PackageSpec(path=pwd()),
            PackageSpec(path=joinpath(pwd(), ".ci", "FewBodyHamiltonians")),
          ])
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using FewBodyVMC
          DocMeta.setdocmeta!(FewBodyVMC, :DocTestSetup, :(using FewBodyVMC); recursive=true)
          doctest(FewBodyVMC)
